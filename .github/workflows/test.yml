name: test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  onchain:
    name: forge test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.7.1
      - run: forge test -vv
        working-directory: onchain

  site:
    name: site tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test site/test.mjs

  scripts:
    name: shell syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: for f in holdings/build.sh synchronizer/*.sh; do bash -n "$f"; done
